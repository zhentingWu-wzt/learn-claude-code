[workspace]
resolver = "2"
members = [
    "harness",
    "s01_agent_loop",
    "s02_tool_use",
    "s03_todo_write",
    "s04_subagent",
    "s05_skill_loading",
    "s06_context_compact",
    "s07_task_system",
    "s08_background_tasks",
    "s09_agent_teams",
    "s10_team_protocols",
    "s11_autonomous_agents",
    "s12_worktree_task_isolation",
    "s_full",
]

[workspace.dependencies]
harness = { path = "harness" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
anyhow = "1"
thiserror = "2"
